<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW_CSS레이아웃</title>
    <style>
        .container {border: 3px solid black; margin-bottom: 30px;}
        .item {color: black; padding: 10px; text-align: center;}
        .red {background-color: hotpink;}
        .green {background-color: greenyellow;}
        .blue {background-color: aqua;}
        .flex-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 150px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .grid-container .item:first-child {
            grid-column: 1 / 3;
        }
    </style>
</head>
<body>
    <h1>1. Flexbox로 배치하기 (가장 많이 사용!)</h1>
    <div class="container flex-container">
        <div class="item red">Item1</div>
        <div class="item green">Item2</div>
        <div class="item blue">Item3</div>
    </div>
    <h1>2. Grid로 배치하기</h1>
    <div class="container grid-container">
        <div class="item red">Item1</div>
        <div class="item green">Item2</div>
        <div class="item blue">Item3</div>
        <div class="item red">Item4</div>
        <div class="item green">Item5</div>
    </div>
</body>
</html>
