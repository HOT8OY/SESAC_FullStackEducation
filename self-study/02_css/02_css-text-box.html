<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS꾸미기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Single+Day&display=swap" rel="stylesheet">
    <style>
        body {font-family: "Single Day"; line-height: 1.6;}
        h1 {color: aquamarine; font-size: 32px; font-weight: lighter; text-align: center;}
        .box {background-color: azure;width: 300px; height: 150px; padding: 20px; border: 2px solid red; margin: 20px;}
        .rounded-box {background-color: violet;border-radius: 20px; color: aliceblue;
                     box-shadow: 15px 10px 25px rgba(0, 0, 0, 0.3);padding: 15px; margin: 15px;}



    </style>
</head>
<body>
    <h1>글자와 상자(box) 꾸미기</h1>
    <p>CSS의 핵심은 글자를 보기 좋게 만들고,
         각 요소가 차지하는 '상자'의 모양과 간격을 조절하는 것입니다.</p>

<div class="box">이것은 기본 상자입니다.
                 안쪽 여백(padding), 테두리(border), 바깥 여백(margin)을 가지고 있습니다.</div>

<div class="rounded-box">이것은 모서리가 둥글고 그림자가 있는 상자입니다.</div>

</body>
</html>
