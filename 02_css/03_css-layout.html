<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 레이아웃</title>
    <style>
        .container {
            border: 3px solid #333;
            margin-bottom: 30px;
        }
        .item {
            color: black;
            padding: 10px;
            text-align: center;
        }
        .red {background-color: hotpink;}
        .green {background-color: greenyellow;}
        .blue {background-color: cyan;}
        /* Flexbox : 한 줄 방향으로 요소를 유연하게 배치 */
        .flex-container {
            display: flex; /* 자식 요소들을 플렉스 아이템으로 만듦 */
            justify-content: space-around; /* 주축 방향으로 아이템들 사이의 여백을 균등하게 배분 */
            align-items: center; /* 교차축(세로) 방향으로 아이템들을 중앙 정렬 */
            height: 150px;
        }
        /* Grid : 2차원 격자(행과 열) 형태로 요소를 배치 */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; /* 사용 가능한 공간을 1:1:1 비율로 나눈 3개의 열을 만듦*/
            gap: 10px; /*아이템들 사이의 간격을 10px로 설정*/
        }
        .grid-container .item:first-child {grid-column: 1 / 3;}
        /* 첫 번째 아이템이 1번 열에서 시작해서 3번 열 앞에서 끝나도록(2칸 차지) 설정*/
        
        /* Position : 요소를 문서의 흐름과 관계없이 특정 위치에 배치 */
        .position-container {
            position: relative; /* 자식 요소의 '절대 위치' 기준점이 됨*/
            height: 200px;
        }
        .position-container .item {
            position:absolute; top: 50px; left: 50px;
        }
    </style>
</head>
<body>
    <h1>1. Flexbox로 배치하기 (가장 많이 사용!)</h1>
    <!--  div item class의 부모는 위의 container flex-container의 div  -->
    <!--  class 내의 이름은 space를 기준으로 이름이 여러개로 구분됨  -->
    <div class="container flex-container">
        <div class="item red">Item 1</div>
        <div class="item green">Item 2</div>
        <div class="item blue">Item 3</div>
    </div>

    <h1>2. Grid로 배치하기</h1>
    <div class="container grid-container">
        <div class="item red">Item 1</div>
        <div class="item green">Item 2</div>
        <div class="item blue">Item 3</div>
        <div class="item red">Item 4</div>
        <div class="item green">Item 5</div>
    </div>

    <h1>3. Position으로 배치하기</h1>
    <div class="container position-container">
        <div class="item blue">Absolute Positon</div>
    </div>

</body>
</html>
