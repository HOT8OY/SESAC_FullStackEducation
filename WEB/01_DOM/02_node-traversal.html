<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>node-traversal</title>
</head>
<body>
    <h1>'HTML 가계도' 탐색하기</h1>
    <pre>
        우리는 querySelector로 특정 요소를 찾은 뒤, 그 요소를 기준으로
        가족(부모, 자식, 형제) 요소를 찾아 나갈 수 있습니다.

        이때, 눈에 보이지 않는 '공백'이나 '줄바꿈' (텍스트 노드) 때문에 겪는 혼란을 피하기 위해
        오직 '요소(Element)'만 찾아주는 프로퍼티들을 사용하는 것이 가장 좋습니다.
        </pre>

    <ul id="family">
        <!-- 이 주석과 줄바꿈도 노드입니다! -->
        <li id="me">나 (기준)</li>
        <li>나의 첫째 형제</li>
        <li>나의 둘째 형제</li>
    </ul>

    <script>
        // 기준이 될 요소를 찾아온다.
        // id="me"라는 요소를 찾아오기
        const $me = document.getElementById('me');
        
        // childNodes는 눈에 보이지 않는 텍스트 노드(줄바꿈)까지 모두 포함하여 혼란을 준다.
        const $family = document.getElementById('family'); // li뿐만 아니라 줄바꿈(text),주석(comment)까지 모두 가져옴.
        console.log($family.childNodes); // NodeList(9) [text, comment, text, li#me, text, li, text, li, text]

        // ## 1. 자식 요소 탐색하기

        // #### children: 모든 '자식 요소'들을 HTMLCollection으로 반환(텍스트 노드 제외)
        const $children = $family.children; // family의 자식 요소만을 취득해옴
        console.log($children); // HTMLCollection(3) [li#me, li, li, me: li#me]

        // #### firstElementChild: 첫 번째 '자식 요소'를 반환
        const $first = $family.firstElementChild;
        console.log($first); // 나 (기준)이 든 <li id="me">를 반환

        // #### lastElementChild: 마지막 '자식 요소'를 반환
        const $last = $family.lastElementChild;
        console.log($last);  // 나의 둘째 형제 가 든 li를 반환

        // ## 2. 부모 요소 탐색하기
        
        // #### parentNode: 나의 '부모 요소'를 반환한다.
        const $parent = $me.parentNode;
        console.log('나의 부모 요소', $parent)  // ul 태그를 반환
        $parent.style.border = '1px solid blue'; // parent가 잘 적용됐는지 눈으로 보기 위해서 ul태그에 보더를 지정.

        // ## 3. 형제 요소 탐색하기

        // #### nextElementSibling: 나의 바로 [다음] '형제 요소'를 반환
        const $next = $me.nextElementSibling;
        $next.style.color = 'green';    // 나의 첫째 형제에 green
        // #### previousElementSibling: 나의 바로 [이전] '형제 요소'를 반환
        const $prev = $next.previousElementSibling;
        console.log($prev); // 기준 요소(나의 첫째 형제)의 이전 형제인 나 (기준)를 반환 
    </script>
</body>
</html>
