<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-List</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const {useState} = React;
        function Header() {
            const headerstyle = {
                backgroundColor: 'lightpink',
                padding: '20px',
                textAlign: 'center',
                color: 'white',
            };
            return (
                <div>
                    <h1 style={headerstyle}>오늘의 할일! 2025.10.14</h1>
                </div>
            )
        };
        // 자식 컴포넌트
        // 데이터를 받아 화면에 그리고 부모가 시키는 일만 수행
        function TodoItem ({ todo }) {
            const [todos, setTodos] = useState('');
            const [inputValue, setInputValue] = useState('');
            const handleAdd = () => {
                if (inputValue.trim() === '') return;
                setTodos([...todos, inputValue]);
                setInputValue('');
            };
            return (
                <>
                    <ul>
                        {todos.map((todo, index) => (                            
                            <li>
                                <input type="checkbox" />
                                <span>{todo}</span>
                                <button>❌</button>
                            </li>
                        ))}
                    </ul>
                </>
            )
        };
        // 부모 컴포넌트
        // 상태(state), 상태를 변경하는 모든 로직을 이 컴포넌트가 책임진다.
        function TodoList() {
            return (
                <>
                    <TodoItems />
                    <input/>
                    <button>추가하기</button>
                </>
            )
        };

        function Content() {
            return (
                <>
                    <TodoList />
                </>
            )
        };

        function Footer() {
            const footerStyle = {
                backgroundColor: 'lightpink',
                padding: '20px',
                textAlign: 'center',
                color: 'white'
            };
            return (
                <p style={footerStyle}>Copyright 2025. Sunjoon all rights reserved.</p>
            )
        };

        function TodoApp() {
            return (
                <div>
                    <Header />
                    <Content />
                    <Footer />
                </div>
            )
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<TodoApp />);

    </script>
</body>
</html>
