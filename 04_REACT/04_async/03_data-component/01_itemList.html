<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .item {
            background-color: azure;
            border: 1px solid black;
            display: inline-block;
            width: 350px;
            margin: 10px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">

        const { useEffect, useState } = React;

        // 교육 개요 및 학습 목적
        /*
            [교육 개요]
            이 코드는 React에서 비동기적으로 외부 API(서버)에서 데이터를 받아와 화면에 출력하는 방법을 학습합니다.
            - useEffect를 사용해 컴포넌트가 처음 렌더링될 때 데이터를 가져옵니다.
            - useState로 로딩 상태, 에러 상태, 데이터 상태를 관리합니다.
            - 비동기 처리와 상태 관리를 통해 실제 서비스에서 데이터를 다루는 기본 원리를 익힙니다.

            [배우는 이유]
            실제 웹 서비스에서는 서버에서 데이터를 받아와 화면에 보여주는 일이 매우 많습니다.
            비동기 처리와 상태 관리 방법을 익히면, 다양한 상황에서 안정적으로 데이터를 다룰 수 있습니다.
        */

        function Title() {
            return <h1>회원목록</h1>
        }

        function ItemList() {

            // users: 받아온 회원 데이터 배열
            // loading: 데이터 로딩 중 여부
            // error: 에러 발생 시 에러 정보
            const [ users, setUsers ] = useState([]);
            const [ loading, setLoading ] = useState(true); // 페이지의 로딩 상태
            const [ error, setError ] = useState(null);

            // 컴포넌트가 처음 화면에 나타날 때(API 호출 시점)
            useEffect(() => {
                // fetch로 외부 API에서 회원 데이터를 받아옵니다.
                fetch('https://jsonplaceholder.typicode.com/users')
                    .then(response => {
                        // 응답이 정상인지 확인합니다.
                        if(!response.ok) {
                            throw new Error('네트워크 응답에 문제가 있습니다.');
                        }
                        // 응답 데이터를 JSON 객체로 변환(파싱)합니다.
                        return response.json()
                    })
                    .then(responseUsers => {
                        // 받아온 데이터를 users 상태에 저장합니다.
                        setUsers(responseUsers);
                        // 데이터 로딩이 끝났으므로 loading을 false로 변경합니다.
                        setLoading(false);
                    })
                    .catch(error => {
                        // 에러가 발생하면 콘솔에 출력하고, error 상태에 저장합니다.
                        console.error("데이터를 불러오는데 실패했습니다.", error);
                        setError(error); // 에러가 발생하면 에러 state에 저장
                    })
                    .finally(() => setLoading(false)); // 성공/실패와 관계없이 로딩 종료
            }, []) // 빈 배열: 컴포넌트가 처음 렌더링될 때 한 번만 실행

            // 로딩 중일 때는 안내 메시지를 보여줍니다.
            if(loading) {
                return <p>로딩 중...</p>
            }

            // 에러가 발생했을 때는 에러 메시지를 보여줍니다.
            if(error) {
                return <p>오류가 발생했습니다. {error.message}</p>
            }

            // 정상적으로 데이터를 받아왔을 때 회원 목록을 출력합니다.
            return (
                <>
                    {users.map(user => <Item key={user.id} user={user}/>)}
                </>
            )
        }

        // 회원 한 명의 정보를 보여주는 컴포넌트
        function Item({user}) {
            return(
                <div className="item">
                    {/* 이름과 아이디(아이디는 username) */}
                    <h4>{user.name}({user.username})</h4>
                    {/* 이메일, 웹사이트, 회사 이름 */}
                    email: {user.email}<br/>
                    website: {user.website}<br/>
                    company name: {user.company?.name}
                </div>
            )
        }

        // 전체 앱 구조를 담당하는 컴포넌트
        function App() {
            return (
                <>
                    <Title/>
                    <ItemList />
                </>
            )
        }

        // App 컴포넌트를 root DOM에 렌더링합니다.
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    </script>
</body>
</html>
